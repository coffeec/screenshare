<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>屏幕共享</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥️</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ambient-bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div id="join-panel">
  <div class="join-card">
    <div class="icon-wrapper">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
    </div>
    <h1>屏幕共享</h1>
    <p class="join-sub">极速、流畅的无界体验</p>
    <form id="join-form">
      <div class="input-group">
        <label for="room-input">房间号</label>
        <input id="room-input" required placeholder="friday" autocomplete="off">
      </div>
      <div class="input-group">
        <label for="name-input">昵称</label>
        <input id="name-input" required placeholder="你的名字" autocomplete="off">
      </div>
      <button type="submit" class="btn-primary">
        <span>加入房间</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
      <p id="join-error" class="error" hidden></p>
    </form>
  </div>
</div>

<div id="room-panel" hidden>
  <div id="members-panel" class="members-panel chrome" hidden>
    <div class="members-header">
      <h3>大厅 (<span id="members-count">0</span>)</h3>
      <button id="close-members-btn" class="icon-btn" title="关闭">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="members-group">
      <h4 class="group-title">📺 正在共享 (<span id="sharing-count">0</span>)</h4>
      <ul id="sharing-list" class="members-list"></ul>
    </div>
    <hr class="members-divider">
    <div class="members-group">
      <h4 class="group-title">👀 观众席 (<span id="watching-count">0</span>)</h4>
      <ul id="watching-list" class="members-list"></ul>
    </div>
  </div>
  <header id="room-header" class="chrome">
    <span class="live-dot" aria-hidden="true"></span>
    <span id="room-label"></span>
  </header>
  <p id="status-banner" hidden></p>
  <div id="empty-state" class="empty-state">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
    <h2>等待共享屏幕</h2>
    <p>点击下方按钮开始共享你的屏幕，或等待其他成员共享</p>
  </div>
  <div id="grid"></div>
  <div id="control-bar" class="chrome">
    <button id="members-btn" class="btn-ghost" title="大厅">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      <span class="badge" id="members-badge" hidden>0</span>
    </button>
    <div class="divider"></div>
    <div class="select-wrapper">
      <svg class="select-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      <select id="codec-select" title="编码器">
        <option value="h264" selected>电竞模式</option>
        <option value="vp9">观影模式</option>
      </select>
    </div>
    <div class="select-wrapper">
      <svg class="select-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
      <select id="bitrate-select" title="共享码率">
        <option value="3">黄金路线</option>
        <option value="5">钻石路线</option>
        <option value="8" selected>猎杀路线</option>
      </select>
    </div>
    <div class="divider"></div>
    <button id="share-btn" class="btn-primary">
      <svg class="icon-share" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="14" rx="2" ry="2"></rect><polyline points="8 21 16 21"></polyline><line x1="12" y1="17" x2="12" y2="21"></line><path d="M8 10l4-4 4 4"></path><path d="M12 6v8"></path></svg>
      <span class="btn-text">共享屏幕</span>
    </button>
    <button id="stats-btn" class="btn-ghost" title="实时统计">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
    </button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
